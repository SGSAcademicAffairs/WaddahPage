<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waddah · SGS</title>
<style>
:root {
  --navy: #1c2d6b; --navy-2: #22377f; --ink: #0d2233; --green: #61b947; --green-d: #3f8f2c; --sand: #d9a441;
  --card: rgba(255, 255, 255, 0.82); --card-line: rgba(13, 34, 51, 0.10); --text: #0d2233; --muted: #5b6b78;
  --font: "Segoe UI", "Tahoma", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #e9edf0; color: var(--text); font-family: var(--font); }
button { font: inherit; color: inherit; }

/* ── terminal hall ─────────────────────────────────── */
.scene { position: fixed; inset: 0; overflow: hidden; }
.scene svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.walkers { position: absolute; inset: 0; pointer-events: none; }
.walker { position: absolute; left: 0; will-change: transform; }
.walker svg { display: block; overflow: visible; }
.walker .sw { transform-box: view-box; animation-duration: 1s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
.walker .bob { animation-name: bob; }
.walker .fwd { animation-name: swingF; }
.walker .back { animation-name: swingB; }
.walker .afwd { animation-name: armF; }
.walker .aback { animation-name: armB; }
.walker .hem { animation-name: hem; }
@keyframes bob { 0%, 50%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(-2px); } }
@keyframes swingF { 0%, 100% { transform: rotate(22deg); } 50% { transform: rotate(-22deg); } }
@keyframes swingB { 0%, 100% { transform: rotate(-22deg); } 50% { transform: rotate(22deg); } }
@keyframes armF { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
@keyframes armB { 0%, 100% { transform: rotate(16deg); } 50% { transform: rotate(-16deg); } }
@keyframes hem { 0%, 100% { transform: skewX(-4deg); } 50% { transform: skewX(4deg); } }
.depth-veil { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, rgba(233, 237, 240, 0) 55%, rgba(233, 237, 240, 0.0) 70%, rgba(220, 226, 231, 0.35)); }

/* ── layout ────────────────────────────────────────── */
.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.stage { position: relative; min-height: 0; }
.panel { position: relative; display: flex; align-items: center; justify-content: center; padding: 22vh 4vw 6vh 1vw; min-height: 0; }

/* Waddah + gate podium (sizes set by layout()) */
.shadow { position: absolute; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0) 70%); }
.waddah { position: absolute; transform: translateX(-50%); }
.podium { position: absolute; bottom: 0; aspect-ratio: 700 / 330; transform: translateX(-50%); filter: drop-shadow(0 12px 30px rgba(13, 34, 51, 0.30)); }
.podium svg { width: 100%; height: 100%; display: block; }

/* rig (layered portrait), positions in % of the 776×1014 cut-out */
.wr-frame { position: relative; height: 100%; aspect-ratio: 776 / 1014; }
.wr { position: absolute; inset: 0; --open: 0; --browL: 0; --browR: 0; --tilt: 0deg; --hx: 0%; --hy: 0%; --breath: 0; --sway: 0deg; --lean: 0; }
.wr img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.wr-figure { position: absolute; inset: 0; transform-origin: 50% 100%; will-change: transform;
  transform: rotate(var(--sway)) scale(calc(1 + var(--breath) * 0.005 + var(--lean) * 0.012), calc(1 + var(--breath) * 0.011 + var(--lean) * 0.012)); }
.wr-head { position: absolute; inset: 0; transform-origin: 45.1% 45.4%; will-change: transform; transform: translate(var(--hx), var(--hy)) rotate(var(--tilt)); }
.wr-brow { position: absolute; inset: 0; }
.wr-brow img { transform: scaleY(calc(1 + var(--b) * 0.16)); }
.wr-brow.l { --b: var(--browL); -webkit-mask-image: radial-gradient(ellipse 7.2% 2.6% at 36.9% 21.4%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 7.2% 2.6% at 36.9% 21.4%, #000 55%, transparent 100%); }
.wr-brow.l img { transform-origin: 36.9% 23.3%; }
.wr-brow.r { --b: var(--browR); -webkit-mask-image: radial-gradient(ellipse 7.1% 2.4% at 51.9% 20.4%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 7.1% 2.4% at 51.9% 20.4%, #000 55%, transparent 100%); }
.wr-brow.r img { transform-origin: 51.9% 22.3%; }
.wr-lids { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wr-inside { position: absolute; left: 44.7%; top: 35.95%; width: 10.6%; height: 1.68%; border-radius: 50%;
  transform: translateX(-50%) scaleY(var(--open)); transform-origin: 50% 0;
  background: radial-gradient(ellipse 50% 60% at 50% 35%, #1c0606 0%, #2e0b0b 55%, #4a1818 80%, rgba(74, 24, 24, 0) 100%); }
.wr-jaw { position: absolute; inset: 0; -webkit-mask-image: radial-gradient(ellipse 11.6% 5.4% at 44.7% 41.7%, #000 78%, transparent 100%); mask-image: radial-gradient(ellipse 11.6% 5.4% at 44.7% 41.7%, #000 78%, transparent 100%); }
.wr-jaw img { transform: translateY(calc(var(--open) * 0.94%)); }

/* speech bubble */
.bubble { position: absolute; padding: 2vh 1.5vw; border-radius: 24px 24px 24px 6px; background: #fff; color: var(--ink);
  font-size: clamp(15px, 2.1vh, 26px); line-height: 1.5; box-shadow: 0 18px 50px rgba(13, 34, 51, 0.22); border: 1px solid rgba(13, 34, 51, 0.06);
  opacity: 0; transform: translateY(10px) scale(0.98); transition: opacity 0.35s, transform 0.35s; pointer-events: none; }
.bubble.show { opacity: 1; transform: none; }
.bubble.tail-right { border-radius: 24px 24px 6px 24px; }
.bubble .who { display: block; font-size: 0.72em; font-weight: 700; color: var(--green-d); margin-bottom: 0.4em; }
.bubble .dots span { display: inline-block; width: 0.55em; height: 0.55em; margin: 0 0.12em; border-radius: 50%; background: var(--navy); animation: dot 1s infinite; }
.bubble .dots span:nth-child(2) { animation-delay: 0.15s; } .bubble .dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot { 0%, 100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

/* ── question card ─────────────────────────────────── */
.card { width: min(100%, 680px); border-radius: 28px; background: var(--card); border: 1px solid rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
  box-shadow: 0 30px 80px rgba(13, 34, 51, 0.20); padding: 3.4vh 2.4vw 2.6vh; display: flex; flex-direction: column; gap: 2.4vh; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
.eyebrow { display: inline-flex; align-items: center; gap: 0.5em; font-size: clamp(11px, 1.35vh, 15px); letter-spacing: 0.22em; text-transform: uppercase; color: var(--green-d); font-weight: 700; }
.eyebrow::before { content: ""; width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(97, 185, 71, 0.2); }
[dir="rtl"] .eyebrow { letter-spacing: 0; }
h1 { margin: 0.5vh 0 0; font-size: clamp(26px, 4.6vh, 56px); line-height: 1.05; font-weight: 800; color: var(--navy); letter-spacing: -0.01em; }
.sub { margin: 0.8vh 0 0; font-size: clamp(13px, 1.75vh, 20px); color: var(--muted); }
.lang { display: flex; padding: 4px; border-radius: 999px; background: rgba(13, 34, 51, 0.07); flex-shrink: 0; }
.lang button { border: 0; background: transparent; border-radius: 999px; padding: 0.5em 1em; font-size: clamp(12px, 1.6vh, 17px); font-weight: 600; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--navy); color: #fff; box-shadow: 0 4px 12px rgba(28, 45, 107, 0.3); }

.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.6vw; padding: 5px; border-radius: 18px; background: rgba(13, 34, 51, 0.06); }
.tab { border: 0; border-radius: 14px; background: transparent; padding: 1.2vh 0.6vw; font-size: clamp(13px, 1.75vh, 20px); font-weight: 700; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 0.5em; transition: background 0.2s, color 0.2s; }
.tab .n { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; border-radius: 8px; background: rgba(13, 34, 51, 0.08); font-size: 0.8em; }
.tab[aria-selected="true"] { background: #fff; color: var(--navy); box-shadow: 0 4px 14px rgba(13, 34, 51, 0.12); }
.tab[aria-selected="true"] .n { background: var(--green); color: #fff; }

.questions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4vh 1vw; }
.qbtn { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 1.2vh; text-align: start;
  min-height: 15vh; padding: 2vh 1.2vw; border-radius: 20px; border: 1px solid var(--card-line); background: #fff; cursor: pointer;
  box-shadow: 0 6px 18px rgba(13, 34, 51, 0.06); transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s; }
.qbtn:hover { box-shadow: 0 12px 28px rgba(13, 34, 51, 0.12); }
.qbtn:active { transform: scale(0.98); }
.qbtn .ico { width: 2.6em; height: 2.6em; border-radius: 14px; display: grid; place-items: center; font-size: clamp(16px, 2.2vh, 26px); background: #eef3f7; }
.qbtn .label { font-size: clamp(15px, 2.15vh, 25px); font-weight: 700; color: var(--ink); line-height: 1.25; }
.qbtn .go { position: absolute; inset-inline-end: 1.1vw; top: 2vh; width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; background: #eef3f7; color: var(--navy); font-weight: 700; font-size: clamp(12px, 1.5vh, 16px); }
[dir="rtl"] .qbtn .go { transform: scaleX(-1); }
.qbtn.active { border-color: var(--green); box-shadow: 0 0 0 3px rgba(97, 185, 71, 0.25), 0 12px 28px rgba(13, 34, 51, 0.12); }
.qbtn.active .ico { background: var(--green); }
.qbtn.active .go { background: var(--green); color: #fff; }
.foot { display: flex; justify-content: space-between; gap: 1rem; font-size: clamp(11px, 1.3vh, 14px); color: var(--muted); }

@media (max-aspect-ratio: 1/1) {
  .app { grid-template-columns: 1fr; grid-template-rows: 52% 48%; }
  .panel { padding: 0 4vw 3vh; align-items: flex-start; }
  .card { width: 100%; padding: 2.4vh 4vw 2vh; gap: 1.7vh; }
  .qbtn { min-height: 10.5vh; padding: 1.5vh 3vw; }
  .tab { padding: 1vh 1vw; }
}
@media (prefers-reduced-motion: reduce) { .walker { display: none; } }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <svg class="bg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f4f6"/><stop offset="1" stop-color="#dde3e8"/></linearGradient>
      <linearGradient id="glassW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="0.55" stop-color="#d7e7f3"/><stop offset="1" stop-color="#b3cadb"/></linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd6dc"/><stop offset="0.25" stop-color="#e3e8ec"/><stop offset="1" stop-color="#bfc8cf"/></linearGradient>
      <linearGradient id="col" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cbd4dc"/><stop offset="0.45" stop-color="#ffffff"/><stop offset="1" stop-color="#bcc7d0"/></linearGradient>
      <radialGradient id="sunlit" cx="0.3" cy="0.4" r="0.7"><stop offset="0" stop-color="#fff6e0" stop-opacity="0.65"/><stop offset="1" stop-color="#fff6e0" stop-opacity="0"/></radialGradient>
      <filter id="far"><feGaussianBlur stdDeviation="2.4"/></filter>
      <filter id="mid"><feGaussianBlur stdDeviation="1.2"/></filter>
      <g id="column">
        <path d="M-26 0 L-14 -380 Q-12 -470 -70 -560 Q-140 -660 -260 -720 L-236 -742 Q-110 -690 -30 -600 Q0 -566 0 -540 Q0 -566 30 -600 Q110 -690 236 -742 L260 -720 Q140 -660 70 -560 Q12 -470 14 -380 L26 0Z" fill="url(#col)"/>
      </g>
      <g id="plane"><path d="M0 0 h16 l10 -10 h6 l-5 10 h12 l4 -5 h4 l-2 5 h3 v3 h-3 l2 5 h-4 l-4 -5 h-12 l5 10 h-6 l-10 -10 h-16z" fill="currentColor"/></g>
    </defs>

    <rect width="1920" height="1080" fill="url(#ceil)"/>
    <!-- ceiling ribs -->
    <g stroke="#c9d2da" stroke-width="10" fill="none" opacity="0.8">
      <path d="M0 120 Q960 -10 1920 120"/><path d="M0 230 Q960 110 1920 230"/>
    </g>
    <g fill="#ffffff" opacity="0.9"><circle cx="380" cy="70" r="5"/><circle cx="760" cy="40" r="5"/><circle cx="1160" cy="40" r="5"/><circle cx="1540" cy="70" r="5"/></g>

    <!-- glass wall, daylight -->
    <rect x="0" y="300" width="1920" height="440" fill="url(#glassW)"/>
    <rect x="0" y="300" width="1920" height="440" fill="url(#sunlit)"/>
    <g stroke="#9db1c1" stroke-width="2.5" opacity="0.65">
      <line x1="0" y1="300" x2="1920" y2="300"/><line x1="0" y1="470" x2="1920" y2="470" opacity="0.5"/>
      <line x1="140" y1="300" x2="140" y2="740"/><line x1="340" y1="300" x2="340" y2="740"/><line x1="540" y1="300" x2="540" y2="740"/>
      <line x1="740" y1="300" x2="740" y2="740"/><line x1="940" y1="300" x2="940" y2="740"/><line x1="1140" y1="300" x2="1140" y2="740"/>
      <line x1="1340" y1="300" x2="1340" y2="740"/><line x1="1540" y1="300" x2="1540" y2="740"/><line x1="1740" y1="300" x2="1740" y2="740"/>
    </g>
    <!-- aircraft outside -->
    <g filter="url(#far)" opacity="0.6">
      <rect x="980" y="600" width="520" height="40" rx="20" fill="#f4f7f9"/>
      <path d="M1400 604 L1460 470 L1496 470 L1480 604Z" fill="#0e6b6b"/>
      <path d="M1160 630 L1260 690 L1300 690 L1230 626Z" fill="#e2e8ec"/>
    </g>

    <!-- gate seating, screens -->
    <g filter="url(#far)">
      <g fill="#556170"><rect x="160" y="690" width="300" height="22" rx="6"/><rect x="160" y="668" width="300" height="20" rx="6" opacity="0.6"/>
        <rect x="1420" y="690" width="330" height="22" rx="6"/><rect x="1420" y="668" width="330" height="20" rx="6" opacity="0.6"/></g>
      <rect x="880" y="540" width="140" height="84" rx="6" fill="#1f2a3a"/><rect x="890" y="550" width="120" height="64" fill="#3a6a9b"/>
      <rect x="944" y="624" width="10" height="116" fill="#8b97a3"/>
    </g>

    <!-- polished floor -->
    <rect x="0" y="740" width="1920" height="340" fill="url(#floor)"/>
    <rect x="0" y="740" width="1920" height="5" fill="#ffffff" opacity="0.6"/>
    <g opacity="0.14" fill="#ffffff"><rect x="584" y="745" width="22" height="200"/><rect x="1324" y="745" width="22" height="200"/></g>

    <!-- white tree columns, like Terminal 1 -->
    <g filter="url(#mid)" opacity="0.95">
      <use href="#column" transform="translate(595 745) scale(0.66)"/>
      <use href="#column" transform="translate(1335 745) scale(0.66)"/>
    </g>
    <use href="#column" transform="translate(40 1080) scale(1.45)"/>
    <use href="#column" transform="translate(1900 1080) scale(1.45)"/>

    <!-- hanging gate signs -->
    <g id="signA">
      <line x1="180" y1="0" x2="180" y2="40" stroke="#9aa6b1" stroke-width="3"/><line x1="600" y1="0" x2="600" y2="40" stroke="#9aa6b1" stroke-width="3"/>
      <rect x="110" y="40" width="560" height="112" rx="6" fill="#1c2d6b"/>
      <rect x="110" y="152" width="560" height="52" fill="#cfe0f2"/>
      <path d="M146 128 L146 70 L131 86 M146 70 L161 86" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="182" y="66" width="62" height="62" rx="9" fill="#fff"/>
      <use href="#plane" transform="translate(193 98) rotate(-30 22 0)" style="color:#1c2d6b"/>
      <text x="330" y="92" font-family="Segoe UI, Tahoma, Arial" font-weight="700" font-size="30" fill="#fff" text-anchor="middle">البوابات</text>
      <text x="330" y="126" font-family="Segoe UI, Arial" font-weight="700" font-size="25" fill="#fff" text-anchor="middle">Gates</text>
      <text x="540" y="122" font-family="Segoe UI, Arial" font-weight="800" font-size="58" fill="#fff" text-anchor="middle">A02-12</text>
      <text x="390" y="187" font-family="Segoe UI, Arial" font-weight="600" font-size="23" fill="#1c2d6b" text-anchor="middle">↑  Prayer rooms · مصليات</text>
    </g>
    <g id="signB">
      <line x1="1300" y1="0" x2="1300" y2="40" stroke="#9aa6b1" stroke-width="3"/><line x1="1660" y1="0" x2="1660" y2="40" stroke="#9aa6b1" stroke-width="3"/>
      <rect x="1240" y="40" width="480" height="112" rx="6" fill="#1c2d6b"/>
      <rect x="1240" y="152" width="480" height="52" fill="#cfe0f2"/>
      <text x="1330" y="122" font-family="Segoe UI, Arial" font-weight="800" font-size="62" fill="#fff" text-anchor="middle">A01</text>
      <rect x="1410" y="66" width="62" height="62" rx="9" fill="#fff"/>
      <use href="#plane" transform="translate(1463 98) scale(-1 1)" style="color:#1c2d6b"/>
      <path d="M1500 96 L1560 96 M1540 78 L1562 96 L1540 114" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1645" y="110" font-family="Segoe UI, Tahoma, Arial" font-weight="700" font-size="30" fill="#fff" text-anchor="middle">البوابة</text>
      <text x="1480" y="187" font-family="Segoe UI, Arial" font-weight="600" font-size="23" fill="#1c2d6b" text-anchor="middle">Toilets · دورات مياه</text>
    </g>
  </svg>
  <div class="walkers" id="walkers"></div>
  <div class="depth-veil"></div>
</div>

<main class="app" id="app">
  <section class="stage" aria-label="Waddah">
    <div class="shadow" id="shadow"></div>
    <div class="waddah" id="waddah">
      <div class="wr-frame">

  const flip = leftToRight ? 1 : -1;
  walkers.appendChild(el);
  const anim = el.animate([{ transform: `translateX(${start}px) scale(${scale * flip}, ${scale})` },
                           { transform: `translateX(${to}px) scale(${scale * flip}, ${scale})` }],
                          { duration: dur, easing: "linear", fill: "forwards" });
  const step = (0.9 + Math.random() * 0.25).toFixed(2) + "s";
  el.querySelectorAll(".sw").forEach((n) => (n.style.animationDuration = step));
  anim.onfinish = () => { el.remove(); spawnWalker(false); };
}
const crowd = innerWidth > 900 ? 12 : 8;
for (let i = 0; i < crowd; i++) spawnWalker(true);

// ── Screen ────────────────────────────────────────────────────────────────────
let lang = "en", group = 0, active = null, bubbleTimer = 0, idleTimer = 0;
const $ = (id) => document.getElementById(id);
function bubble(html, keepMs) {
  clearTimeout(bubbleTimer); $("bubble").innerHTML = html; $("bubble").classList.add("show");
  if (keepMs) bubbleTimer = setTimeout(() => $("bubble").classList.remove("show"), keepMs);
}
function hideBubbleLater() { clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => $("bubble").classList.remove("show"), 9000); }

function layout() {
  const stage = document.querySelector(".stage"), W = stage.clientWidth, H = stage.clientHeight;
  const portrait = innerHeight > innerWidth;
  const podW = Math.min(W * 0.58, H * (portrait ? 0.8 : 0.62)), podH = podW * 330 / 700;
  const cx = W * 0.5;
  const wadH = Math.min(H * (portrait ? 0.84 : 0.76), (H - podH * 0.1) * 0.98);
  const wadW = wadH * 776 / 1014, wadBottom = podH * 0.84;
  Object.assign($("podium").style, { width: podW + "px", left: cx + "px" });
  Object.assign($("waddah").style, { height: wadH + "px", left: cx + "px", bottom: wadBottom + "px" });
  Object.assign($("shadow").style, { width: podW * 1.15 + "px", height: podH * 0.22 + "px", left: cx + "px", bottom: -podH * 0.08 + "px" });
  const bub = $("bubble"), top = Math.max(12, H - wadBottom - wadH + wadH * 0.04);
  const rightRoom = W - (cx + wadW * 0.15) - 16, leftRoom = cx - wadW * 0.19 - 16;
  const right = rightRoom >= 260 || rightRoom >= leftRoom;
  const width = Math.max(220, Math.min(right ? rightRoom : leftRoom, 500));
  Object.assign(bub.style, { width: width + "px", top: top + "px", left: (right ? cx + wadW * 0.15 : Math.max(12, cx - wadW * 0.19 - width)) + "px" });
  bub.classList.toggle("tail-right", !right);
}
addEventListener("resize", layout);

function render() {
  const ui = UI[lang];
  document.documentElement.lang = lang;
  $("panel").dir = lang === "ar" ? "rtl" : "ltr";
  $("eyebrow").textContent = ui.eyebrow; $("title").textContent = ui.title; $("subtitle").textContent = ui.subtitle; $("foot1").textContent = ui.foot1; $("foot2").textContent = ui.foot2;
  $("langEn").setAttribute("aria-pressed", lang === "en"); $("langAr").setAttribute("aria-pressed", lang === "ar");
  const tabs = $("tabs"); tabs.innerHTML = "";
  GROUPS.forEach((g, i) => {
    const t = document.createElement("button");
    t.className = "tab"; t.setAttribute("role", "tab"); t.setAttribute("aria-selected", i === group);
    t.innerHTML = `<span class="n">${i + 1}</span><span></span>`; t.lastChild.textContent = g[lang];
    t.addEventListener("click", () => { group = i; render(); resetIdle(); });
    tabs.appendChild(t);
  });
  const box = $("questions"); box.innerHTML = "";
  GROUPS[group].items.forEach((qa, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "qbtn" + (active && active[0] === group && active[1] === i ? " active" : "");
    b.innerHTML = `<span class="ico" aria-hidden="true">${qa.ico}</span><span class="label"></span><span class="go" aria-hidden="true">›</span>`;
    b.querySelector(".label").textContent = qa[lang][0];
    b.addEventListener("click", () => ask(group, i));
    box.appendChild(b);
  });
}
function ask(g, i) {
  active = [g, i]; render(); resetIdle();
  const [q, a] = GROUPS[g].items[i][lang]; ++token;
  setPhase("thinking"); $("bubble").dir = lang === "ar" ? "rtl" : "ltr";
  bubble('<span class="dots"><span></span><span></span><span></span></span>'); layout();
  setTimeout(() => {
    bubble(`<span class="who"></span><span class="txt"></span>`);
    $("bubble").querySelector(".who").textContent = q; $("bubble").querySelector(".txt").textContent = a;
    layout(); say(a);
  }, 650);
}
function setLang(l) { lang = l; ++token; setPhase("idle"); $("bubble").classList.remove("show"); render(); layout(); }
$("langEn").addEventListener("click", () => setLang("en"));
$("langAr").addEventListener("click", () => setLang("ar"));
// When nobody touches the screen for a while: back to the start, and a friendly greeting.
function resetIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (S.phase !== "idle") return resetIdle();
    active = null; group = 0; render(); S.nodAt = performance.now(); S.flashAt = performance.now();
    $("bubble").dir = lang === "ar" ? "rtl" : "ltr"; bubble(UI[lang].wave, 5000); layout(); resetIdle();
  }, 45000);
}
render(); layout(); resetIdle();
setTimeout(() => { $("bubble").dir = "ltr"; bubble(UI.en.hint, 8000); layout(); }, 900);
</script>
</body>
